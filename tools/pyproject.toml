[project]
name = "vtcourses"
version = "0.1.0"
description = "Scrapers and doc generators for the VT CS course guide"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "lxml>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vtcourses"]
