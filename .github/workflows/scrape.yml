name: Scrape VT data

# Two cadences in one workflow: the timetable changes constantly during
# registration, the catalog changes a few times a year.
on:
  schedule:
    - cron: "*/30 * * * *" # timetable
    - cron: "17 6 * * 1" # catalog, Mondays
  workflow_dispatch:
    inputs:
      catalog:
        description: "Also refresh the catalog"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Scrape timetable
        run: uv run --with httpx --with lxml python -m tools.vtcourses.timetable

      - name: Scrape catalog
        if: github.event.schedule == '17 6 * * 1' || inputs.catalog
        run: uv run --with httpx --with lxml python -m tools.vtcourses.catalog

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
          else
            git commit -m "chore(data): refresh scraped VT data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    # A called workflow can only narrow the caller's permissions, never widen
    # them, so the Pages scopes have to be granted here.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
